default_install_hook_types: [pre-commit, prepare-commit-msg]
repos:
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
    -   id: gitleaks
        stages: [pre-commit]
-   repo: local
    hooks:
    -   id: check-cursor-cli-config
        name: Check Cursor CLI config for identity/cache keys
        entry: scripts/hooks/check-cursor-cli-config.zsh
        language: system
        files: ^cursor/\.config/cursor/cli-config\.json$
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
    -   id: check-dotfiles-git-email
        name: Check dotfiles author and committer email
        entry: scripts/hooks/prepare-commit-msg
        language: system
        stages: [prepare-commit-msg]
        pass_filenames: false
        always_run: true

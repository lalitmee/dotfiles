# Repo-owned native tmux configuration.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# Gum checks tmux info for Tc/RGB flags, not the RGB terminal feature.
set -as terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard on
set -g status-interval 10
set -g @dotfiles-tmux on

# Preserve the user's settings, bindings, and plugin declarations.
source-file ~/.config/tmux/tmux.conf.local

# TPM only registers plugin bindings and loads installed plugins; it does not
# install or update plugins during startup or config reload.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run-shell '"$HOME/.config/tmux/plugins/tpm/tpm"'

# Replace fingers' jump binding after plugins load; keep F for fingers copying.
bind J command-prompt -p "join pane from: " "join-pane -h -s '%%'"

# Apply baseline options after TPM plugins that may set their own defaults.
set-option -g focus-events off
set-option -g display-time 1000
set-option -g repeat-time 600
set-window-option -g display-panes-time 800
set-window-option -g monitor-activity on

# Keep the theme last so it owns final appearance settings.
source-file ~/.config/tmux/themes/cobalt2.conf
source-file -q ~/.local/state/omarchy/current/theme/tmux.conf
source-file -q ~/.local/state/omarchy/current/theme/tmux-personal.conf

tui.theme = "cobalt2"
tui.screen_reader_detection_done = true
model = "gpt-6-luna"
model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[desktop]
followUpQueueMode = "steer"
external-agent-import-sync-item-types = "all"
external-agent-import-sync-enabled = true
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
usePointerCursors = true

[desktop.open-in-target-preferences]
global = "zed"

[desktop.appearanceDarkChromeTheme]
accent = "#3a83f7"
accentSource = "chatgpt"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"MonoLisa Nerd Font"'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[plugins."context7@claude-plugins-official"]
enabled = false

# Claude-specific async hook output is incompatible with this Codex setup.
[plugins."security-guidance@claude-plugins-official"]
enabled = false


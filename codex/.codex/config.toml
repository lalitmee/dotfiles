# Claude-specific async hook output is incompatible with this Codex setup.
[plugins."security-guidance@claude-plugins-official"]
enabled = false

# Use the anonymous endpoint directly; the Claude plugin endpoint requires auth.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"


# Daytime profile (morning / sunrise across India: ~06:00 - 06:30)
# Resets the screen to natural colors without tint
profile {
    time = 06:30
    identity = true
}

# Evening profile (sunset / dusk across India: ~18:00 - 18:30)
# Warm light begins as twilight fades
profile {
    time = 18:30
    temperature = 4500
}

# Night profile (late night relaxation / Omarchy standard night light)
profile {
    time = 21:30
    temperature = 4000
}

